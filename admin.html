<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול — AMIRA AIRLINES</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0b'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23c6a664' font-family='Georgia,serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Assistant:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/admin.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="loginGate" class="checking">
  <div class="login-glow"></div>
  <div class="login-card">
    <div class="logo">
      <div class="word"><b>AMIRA</b> AIRLINES</div>
    </div>
    <div class="login-sub">אזור פרטי</div>
    <h2>כניסה למערכת</h2>
    <form id="loginForm">
      <div class="login-field">
        <label for="login_email">שם פרטי</label>
        <input type="text" id="login_email" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="login_password">סיסמה</label>
        <input type="password" id="login_password" autocomplete="current-password" required>
      </div>
      <p class="login-error" id="loginError">שם פרטי או סיסמה שגויים</p>
      <button type="submit" class="btn btn-gold login-submit">כניסה</button>
    </form>
  </div>
  <p class="login-checking-msg">בודק הרשאות...</p>
</div>

<div class="site-wrap">

  <!-- shown to logged-in visitors who are NOT admin -->
  <div id="accessDenied" class="access-denied">
    <div class="logo"><div class="word"><b>AMIRA</b> AIRLINES</div></div>
    <h1>אין לך גישה לעמוד הזה</h1>
    <p>העמוד הזה מיועד למנהל האתר בלבד.</p>
    <a href="index.html" class="btn btn-gold">חזרה לאתר</a>
  </div>

  <!-- shown to admin only -->
  <div id="adminContent" class="admin-page">
    <div class="admin-header">
      <div class="admin-header-inner">
        <a href="index.html" class="admin-back">&#8594; חזרה לאתר</a>
        <div class="admin-title">ניהול</div>
        <button class="logout-link" onclick="amiraSignOut()" type="button">התנתקות</button>
      </div>
    </div>

    <main class="admin-main">
      <div class="admin-tabs">
        <button class="admin-tab-btn active" data-tab="reviews" type="button">ביקורות</button>
        <button class="admin-tab-btn" data-tab="bookings" type="button">טיסות מוזמנות</button>
      </div>

      <section id="reviewsTab" class="admin-tab-panel active">
        <p class="admin-tab-sub">ביקורות ממתינות מופיעות ראשונות. אשר כדי לפרסם באתר, או מחק לצמיתות.</p>
        <div id="adminReviewsList" class="admin-list"></div>
      </section>

      <section id="bookingsTab" class="admin-tab-panel">
        <div class="bookings-toolbar">
          <p class="admin-tab-sub">כל בקשות הטיסה שהוגשו דרך האתר.</p>
          <button id="exportAllBtn" class="btn btn-ghost btn-sm" type="button">ייצוא הכל ליומן (.ics)</button>
        </div>
        <div id="adminBookingsList" class="admin-list"></div>
      </section>
    </main>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
